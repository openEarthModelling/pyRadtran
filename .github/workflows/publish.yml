name: Publish to PyPI

on:
  release:
    types: [created]
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update release notes from CHANGELOG
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          python -c "
          import re, sys
          with open('CHANGELOG.md') as f:
              content = f.read()
          pattern = rf'## \\[{re.escape(sys.argv[1])}\\].*?(?=## \\[|$)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(0).strip()
              notes = re.sub(r'^## \\[[^\\]]+\\].*?\\n', '', notes).strip()
              print(notes)
          else:
              print('No changelog entry found for version', sys.argv[1])
              sys.exit(1)
          " "$VERSION" > release_notes.md
          gh release edit "$TAG" --notes-file release_notes.md --repo ${{ github.repository }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/pyradtran
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
