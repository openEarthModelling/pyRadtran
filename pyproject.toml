[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyradtran"
version = "0.1.0"
description = "A complete Python wrapper for libRadtran radiative transfer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "xarray",
    "numpy",
    "netCDF4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mkdocs",
    "mkdocstrings[python]>=0.24",
    "mkdocs-material",
]
plot = ["matplotlib", "scipy"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyradtran"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
