[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyRadtran"
version = "0.1.0"
description = "A complete Python wrapper for libRadtran radiative transfer"
readme = "README.md"
authors = [{name = "Fan Zhang", email = "vanvonzhang@gmail.com"}]
license = {text = "MIT"}
keywords = ["radiative transfer", "libradtran", "atmosphere", "remote sensing", "aerosol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "xarray",
    "numpy",
    "netCDF4",
]
# viz modules import matplotlib lazily; matplotlib stays in the `plot` extra (not core).

[project.scripts]
pyradtran = "pyradtran.config.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]
plot = ["matplotlib", "scipy"]

[project.urls]
Homepage = "https://github.com/openEarthModelling/pyRadtran"
Repository = "https://github.com/openEarthModelling/pyRadtran"
Issues = "https://github.com/openEarthModelling/pyRadtran/issues"
Changelog = "https://github.com/openEarthModelling/pyRadtran/blob/main/CHANGELOG.md"
Documentation = "https://openearthmodelling.github.io/pyRadtran/"

[tool.hatch.build.targets.wheel]
packages = ["src/pyradtran"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/pyradtran/data/assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B017", "E402", "E741"]
